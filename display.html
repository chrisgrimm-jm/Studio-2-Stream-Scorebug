<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Studio 2 Scorebug</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: transparent; width: 100%; height: 100%; overflow: hidden; }

.bar {
  position: fixed; left: 269px; right: 269px; bottom: 73px;
  height: 120px;
  background: #fff;
  font-family: 'Barlow', sans-serif;
  display: flex; align-items: center; justify-content: center;
  filter: drop-shadow(0 -2px 10px rgba(0,0,0,.4));
}
.side { flex: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; min-width: 0; }
.logo { width: 92px; height: 92px; object-fit: contain; flex-shrink: 0; }
.score { font-size: 64px; font-weight: 900; color: #111; min-width: 64px; text-align: center; }

.info { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 260px; min-width: 0; text-align: center; }
.info-role { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #999; }
.info-name { width: 100%; font-size: 20px; font-weight: 800; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info-line { width: 100%; font-size: 15px; font-weight: 600; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info-line-lg { width: 100%; font-size: 18px; font-weight: 700; color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.mid { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 0 22px; }

.seg-inning {
  width: 132px; height: 69px;
  background: #f2f2f2; border: 1px solid #e4e4e4; border-radius: 4px;
  position: relative; overflow: visible;
}
.diamond-svg { position: absolute; top: 0; left: 0; width: 132px; height: 69px; overflow: visible; }
.diamond-content {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: row; align-items: center; justify-content: center;
  gap: 6px; z-index: 2;
}
.tri-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tri { width: 0; height: 0; opacity: 0; transition: opacity .2s; }
.tri.top-tri { border-bottom: 9px solid #000; border-left: 8px solid transparent; border-right: 8px solid transparent; }
.tri.bottom-tri { border-top: 9px solid #000; border-left: 8px solid transparent; border-right: 8px solid transparent; }
.tri.on { opacity: 1; }
.inning-num { font-size: 33px; font-weight: 900; color: #000; line-height: 1; }

.base-sq {
  width: 13px; height: 13px; position: absolute;
  transform: rotate(45deg);
  background: rgba(0,0,0,.1); border: 2px solid rgba(0,0,0,.2);
  transition: background .2s, border-color .2s; z-index: 3;
}
.base-sq.on { background: #f59e0b; border-color: #d97706; }
.base-sq-2 { top: -2px; left: 50%; margin-left: -6.5px; }
.base-sq-1 { top: 27px; right: 16px; }
.base-sq-3 { top: 27px; left: 16px; }

.count-bar { display: flex; align-items: stretch; gap: 7px; }
.count-seg {
  display: flex; align-items: center; justify-content: center; gap: 5px;
  background: #f2f2f2; border: 1px solid #e4e4e4; border-radius: 3px;
  padding: 0 9px; height: 26px;
}
.count-label { font-size: 12px; font-weight: 900; color: rgba(0,0,0,.35); text-transform: uppercase; letter-spacing: .06em; }
.dots { display: flex; gap: 4px; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(0,0,0,.1); border: 1.2px solid rgba(0,0,0,.18); }
.dot.on-b { background: #22c55e; border-color: #16a34a; }
.dot.on-s { background: #f59e0b; border-color: #d97706; }
.dot.on-o { background: #ef4444; border-color: #dc2626; }
</style>
</head>
<body>

<div class="bar" id="bar" style="display:none">
  <div class="side away">
    <img class="logo" id="away-logo" alt="">
    <div class="info" id="away-info"></div>
  </div>
  <div class="score" id="away-score">0</div>
  <div class="mid">
    <div class="seg-inning" id="seg-inning">
      <svg class="diamond-svg" viewBox="0 0 132 69" xmlns="http://www.w3.org/2000/svg">
        <polygon points="66,6 108,30 66,54 24,30" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="2"/>
      </svg>
      <div class="base-sq base-sq-2" id="base2"></div>
      <div class="base-sq base-sq-1" id="base1"></div>
      <div class="base-sq base-sq-3" id="base3"></div>
      <div class="diamond-content">
        <div class="tri-col">
          <div class="tri top-tri" id="tri-top"></div>
          <div class="tri bottom-tri" id="tri-bot"></div>
        </div>
        <div class="inning-num" id="inning-num">—</div>
      </div>
    </div>
    <div class="count-bar" id="count-bar">
      <div class="count-seg">
        <span class="count-label">B</span>
        <div class="dots" id="ball-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>
      <div class="count-seg">
        <span class="count-label">S</span>
        <div class="dots" id="strike-dots"><div class="dot"></div><div class="dot"></div></div>
      </div>
      <div class="count-seg">
        <span class="count-label">O</span>
        <div class="dots" id="out-dots"><div class="dot"></div><div class="dot"></div></div>
      </div>
    </div>
  </div>
  <div class="score" id="home-score">0</div>
  <div class="side home">
    <div class="info" id="home-info"></div>
    <img class="logo" id="home-logo" alt="">
  </div>
</div>

<script>
const MLB = 'https://statsapi.mlb.com';
const params = new URLSearchParams(location.search);
const TOPIC = params.get('topic') || '';

firebase.initializeApp({
  apiKey: 'AIzaSyBG2PS2muH4i27HefuLeBnZWW-TZ5dkMCw',
  databaseURL: 'https://pinpoint-abf21-default-rtdb.firebaseio.com'
});
const _db = firebase.database();
const fbKey = t => t.trim().replace(/[.#$\[\]\/\s]+/g, '-');

let gamePk = null, awayId = null, homeId = null, pollTimer = null;
let delayMs = 30000, firstRender = true;

if (TOPIC) {
  _db.ref(`studio2scorebug/${fbKey(TOPIC)}/state`).on('value', snap => {
    const cfg = snap.val();
    if (!cfg || !cfg.gamePk) return;
    delayMs = typeof cfg.delay === 'number' ? cfg.delay : 30000;
    if (cfg.gamePk === gamePk) return;

    gamePk = cfg.gamePk;
    awayId = cfg.awayId;
    homeId = cfg.homeId;
    firstRender = true;

    document.getElementById('away-logo').src = `https://www.mlbstatic.com/team-logos/${awayId}.svg`;
    document.getElementById('home-logo').src = `https://www.mlbstatic.com/team-logos/${homeId}.svg`;
    document.getElementById('bar').style.display = 'flex';

    clearInterval(pollTimer);
    poll();
    pollTimer = setInterval(poll, 5000);
  });
}

// Batter-vs-pitcher season stats, cached per matchup so repeated polls
// don't refetch. Value is undefined (loading), null (no at-bats yet), or a line string.
const vsPitcherCache = new Map();
let showSeasonLine = false;

function formatStatLine(stat) {
  if (!stat || !stat.atBats) return null;
  const extras = [];
  if (stat.homeRuns) extras.push(`${stat.homeRuns} HR`);
  if (stat.doubles) extras.push(`${stat.doubles} 2B`);
  if (stat.rbi) extras.push(`${stat.rbi} RBI`);
  if (stat.baseOnBalls) extras.push(`${stat.baseOnBalls} BB`);
  return `${stat.hits}-${stat.atBats}` + (extras.length ? ` | ${extras.join(', ')}` : '');
}

function getVsPitcherLine(batterId, pitcherId, season, pitcherLastName) {
  const key = `${batterId}_${pitcherId}`;
  if (vsPitcherCache.has(key)) return vsPitcherCache.get(key);

  vsPitcherCache.set(key, undefined);
  fetch(`${MLB}/api/v1/people/${batterId}/stats?stats=vsPlayer&opposingPlayerId=${pitcherId}&group=hitting&sportId=1`)
    .then(r => r.json())
    .then(data => {
      const splits = data.stats?.find(s => s.type?.displayName === 'vsPlayer')?.splits || [];
      const split = splits.find(s => s.season === season);
      const line = split ? `${season} vs ${pitcherLastName}: ${formatStatLine(split.stat) || '0-0'}` : null;
      vsPitcherCache.set(key, line);
    })
    .catch(() => vsPitcherCache.set(key, null));

  return undefined;
}

function personBlock(role, name, lines) {
  return `<div class="info-role">${role}</div><div class="info-name">${name}</div>` +
    lines.filter(Boolean).map(l => `<div class="info-line">${l}</div>`).join('');
}

function batterBlock(role, name, summaryLine, paListLine) {
  return `<div class="info-role">${role}</div><div class="info-name">${name}</div>` +
    (summaryLine ? `<div class="info-line-lg">${summaryLine}</div>` : '') +
    (paListLine ? `<div class="info-line">${paListLine}</div>` : '');
}

const PA_LABELS = {
  single: '1B', double: '2B', triple: '3B', home_run: 'HR',
  walk: 'BB', intent_walk: 'IBB', strikeout: 'K', hit_by_pitch: 'HBP',
  sac_fly: 'SF', sac_bunt: 'SAC', field_out: 'Out', force_out: 'Out',
  grounded_into_double_play: 'DP', double_play: 'DP', fielders_choice: 'FC',
  fielders_choice_out: 'FC', catcher_interf: 'CI', field_error: 'E'
};

// This game's at-bat outcomes for one batter, in order, e.g. "K, BB, 1B".
function paHistory(data, batterId) {
  const plays = data.liveData?.plays?.allPlays || [];
  const outcomes = plays
    .filter(p => p.matchup?.batter?.id === batterId && p.about?.isComplete)
    .map(p => PA_LABELS[p.result?.eventType] || p.result?.event || '');
  return outcomes.filter(Boolean).join(', ');
}

function updateDots(id, count, max, cls) {
  document.querySelectorAll(`#${id} .dot`).forEach((d, i) => {
    d.className = 'dot' + (i < count ? ' ' + cls : '');
  });
}

// Find the most recent pitch thrown, scanning back from the in-progress at-bat
// through completed plays (a play like a pickoff or mound visit has no pitches).
function findLastPitch(data) {
  const plays = data.liveData?.plays?.allPlays || [];
  const cp = data.liveData?.plays?.currentPlay;
  const combined = plays.slice();
  if (cp && (!plays.length || cp.atBatIndex !== plays[plays.length - 1].atBatIndex)) combined.push(cp);
  for (let i = combined.length - 1; i >= 0; i--) {
    const pitches = (combined[i].playEvents || []).filter(e => e.isPitch);
    if (pitches.length) return pitches[pitches.length - 1];
  }
  return null;
}

async function poll() {
  if (!gamePk) return;
  const pk = gamePk;
  try {
    const data = await fetch(`${MLB}/api/v1.1/game/${pk}/feed/live`).then(r => r.json());
    const useDelay = delayMs > 0 && !firstRender;
    firstRender = false;
    if (useDelay) {
      setTimeout(() => { if (pk === gamePk) render(data); }, delayMs);
    } else {
      render(data);
    }
  } catch (e) { console.error(e); }
}

function render(data) {
    const gd = data.gameData;
    const ls = data.liveData?.linescore || {};
    const state = gd.status.abstractGameState;
    const detailed = gd.status.detailedState || '';
    const isFinal = state === 'Final' || detailed.startsWith('Final');

    document.getElementById('away-score').textContent = ls.teams?.away?.runs ?? 0;
    document.getElementById('home-score').textContent = ls.teams?.home?.runs ?? 0;

    const triTop = document.getElementById('tri-top');
    const triBot = document.getElementById('tri-bot');
    const inningNum = document.getElementById('inning-num');
    const countBar = document.getElementById('count-bar');
    const awayInfo = document.getElementById('away-info');
    const homeInfo = document.getElementById('home-info');

    if (isFinal) {
      triTop.classList.remove('on'); triBot.classList.remove('on');
      inningNum.textContent = 'F';
      countBar.style.visibility = 'hidden';
      awayInfo.innerHTML = '';
      homeInfo.innerHTML = '';
    } else if (state === 'Live') {
      const off = ls.offense || {};
      const battingIsAway = off.team?.id === awayId;

      inningNum.textContent = ls.currentInning || 1;
      triTop.classList.toggle('on', battingIsAway);
      triBot.classList.toggle('on', !battingIsAway);

      document.getElementById('base1').classList.toggle('on', !!off.first);
      document.getElementById('base2').classList.toggle('on', !!off.second);
      document.getElementById('base3').classList.toggle('on', !!off.third);

      countBar.style.visibility = 'visible';
      updateDots('ball-dots', ls.balls ?? 0, 3, 'on-b');
      updateDots('strike-dots', ls.strikes ?? 0, 2, 'on-s');
      updateDots('out-dots', ls.outs ?? 0, 2, 'on-o');

      const boxSide = battingIsAway ? 'away' : 'home';
      const pitchSide = battingIsAway ? 'home' : 'away';
      const batterId = off.batter?.id;
      const pitcher = (ls.defense || {}).pitcher;
      const pitcherId = pitcher?.id;
      const battingLine = data.liveData.boxscore?.teams?.[boxSide]?.players?.[`ID${batterId}`]?.stats?.batting?.summary || '';
      const pitching = data.liveData.boxscore?.teams?.[pitchSide]?.players?.[`ID${pitcherId}`]?.stats?.pitching || {};
      const pitchCount = pitching.numberOfPitches != null ? `${pitching.numberOfPitches} pitches` : '';

      const lastPitch = findLastPitch(data);
      const lastPitchLine = lastPitch
        ? `Last: ${lastPitch.details?.type?.description || 'Pitch'}, ${lastPitch.pitchData?.startSpeed ? lastPitch.pitchData.startSpeed.toFixed(1) + ' mph' : ''}`
        : '';

      showSeasonLine = !showSeasonLine;
      const pitcherLastName = pitcher?.fullName?.split(' ').slice(-1)[0] || '';
      const seasonVsLine = batterId && pitcherId
        ? getVsPitcherLine(batterId, pitcherId, gd.game.season, pitcherLastName)
        : undefined;
      const summaryLine = (showSeasonLine && seasonVsLine) ? seasonVsLine : battingLine;
      const paListLine = batterId ? paHistory(data, batterId) : '';

      const batterHtml = batterBlock('At Bat', off.batter?.fullName || '—', summaryLine, paListLine);
      const pitcherHtml = personBlock('Pitching', (ls.defense || {}).pitcher?.fullName || '—', [pitchCount, lastPitchLine]);
      awayInfo.innerHTML = battingIsAway ? batterHtml : pitcherHtml;
      homeInfo.innerHTML = battingIsAway ? pitcherHtml : batterHtml;
    } else {
      triTop.classList.remove('on'); triBot.classList.remove('on');
      inningNum.textContent = '1';
      countBar.style.visibility = 'hidden';
      awayInfo.innerHTML = '';
      homeInfo.innerHTML = '';
    }
}
</script>
</body>
</html>
